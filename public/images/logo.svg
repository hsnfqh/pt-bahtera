<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="logoGlobeCircle">
      <circle cx="55" cy="60" r="46" />
    </clipPath>
  </defs>

  <!-- Logo Container White Box Rounded -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="20" fill="#FFFFFF" stroke="#0852A5" stroke-width="2" />
    
    <!-- Globe Inner -->
    <g transform="translate(5, 5) scale(0.45)">
      <!-- Base Globe Circle -->
      <circle cx="100" cy="100" r="78" fill="#FFFFFF" stroke="#0852A5" stroke-width="5" />

      <!-- Lat & Long Grid -->
      <g clip-path="url(#globeCircle)" fill="none" stroke="#0852A5" stroke-width="3.8">
        <line x1="100" y1="20" x2="100" y2="180" />
        <ellipse cx="100" cy="100" rx="34" ry="78" />
        <ellipse cx="100" cy="100" rx="64" ry="78" />
        <line x1="20" y1="100" x2="180" y2="100" stroke-width="3" />
        <path d="M 28 62 Q 100 82 172 62" />
        <path d="M 52 38 Q 100 52 148 38" />
        <path d="M 28 138 Q 100 118 172 138" />
        <path d="M 52 162 Q 100 148 148 162" />
      </g>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#0852A5" stroke-width="5" />

      <!-- Diagonal Banner -->
      <g transform="rotate(-18 100 100)">
        <rect x="6" y="74" width="188" height="52" fill="#FFFFFF" stroke="#0852A5" stroke-width="5" />
        <text x="100" y="113" text-anchor="middle" font-family="'Georgia', serif" font-weight="900" font-size="41" fill="#E0141D" letter-spacing="7">BAS</text>
      </g>
    </g>
  </g>

  <!-- Typography: Company Name & Subtitle -->
  <g transform="translate(130, 20)">
    <!-- Red Accent Top Bar / Badge -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#D97706" letter-spacing="2.5">
      CREWING &amp; MANNING AGENCY
    </text>

    <!-- Main Company Name in Bold -->
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="23" font-weight="900" fill="#061838" letter-spacing="0.5">
      PT. <tspan fill="#0852A5">BAHTERA</tspan> <tspan fill="#E0141D">ANUGERAH</tspan> <tspan fill="#0852A5">SENTOSA</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F3875" letter-spacing="0.5">
      SIUKAK No. 58.58-R/2024 &bull; SIUPPAK No. 65.21/2016
    </text>
    
    <text x="0" y="88" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      Professional Maritime Crewing &amp; Manning Services
    </text>
  </g>
</svg>
