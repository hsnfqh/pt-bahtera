<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Clip Globe to Circle -->
    <clipPath id="globeCircle">
      <circle cx="100" cy="100" r="78" />
    </clipPath>
  </defs>

  <!-- Globe Background & Grid Lines -->
  <g>
    <!-- Base Globe Circle -->
    <circle cx="100" cy="100" r="78" fill="#FFFFFF" stroke="#0852A5" stroke-width="5" />

    <!-- Lat & Long Grid (Clipped within globe) -->
    <g clip-path="url(#globeCircle)" fill="none" stroke="#0852A5" stroke-width="3.8">
      <!-- Vertical Central Meridian -->
      <line x1="100" y1="20" x2="100" y2="180" />

      <!-- Inner Longitude Ellipse -->
      <ellipse cx="100" cy="100" rx="34" ry="78" />

      <!-- Outer Longitude Ellipse -->
      <ellipse cx="100" cy="100" rx="64" ry="78" />

      <!-- Equator Line -->
      <line x1="20" y1="100" x2="180" y2="100" stroke-width="3" />

      <!-- Northern Parallels (Latitudes) -->
      <path d="M 28 62 Q 100 82 172 62" />
      <path d="M 52 38 Q 100 52 148 38" />

      <!-- Southern Parallels (Latitudes) -->
      <path d="M 28 138 Q 100 118 172 138" />
      <path d="M 52 162 Q 100 148 148 162" />
    </g>

    <!-- Outer Circle Rim -->
    <circle cx="100" cy="100" r="78" fill="none" stroke="#0852A5" stroke-width="5" />
  </g>

  <!-- Diagonal Banner with "BAS" -->
  <g transform="rotate(-18 100 100)">
    <!-- White Box Banner with Blue Outline -->
    <rect x="6" y="74" width="188" height="52" fill="#FFFFFF" stroke="#0852A5" stroke-width="5" />

    <!-- Bold Red BAS Letters -->
    <text x="100" y="113" text-anchor="middle" font-family="'Georgia', 'Times New Roman', 'Rockwell', 'Palatino', serif" font-weight="900" font-size="41" fill="#E0141D" letter-spacing="7">BAS</text>
  </g>
</svg>
