<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Clip Globe to Circle -->
    <clipPath id="globeCircle">
      <circle cx="100" cy="100" r="92" />
    </clipPath>
  </defs>

  <!-- Globe Background & Grid Lines -->
  <g>
    <!-- Base Globe Circle -->
    <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="#0852A5" stroke-width="8" />

    <!-- Lat & Long Grid (Clipped within globe) -->
    <g clip-path="url(#globeCircle)" fill="none" stroke="#0852A5" stroke-width="4.5">
      <!-- Vertical Central Meridian -->
      <line x1="100" y1="8" x2="100" y2="192" />

      <!-- Inner Longitude Ellipse -->
      <ellipse cx="100" cy="100" rx="38" ry="92" />

      <!-- Outer Longitude Ellipse -->
      <ellipse cx="100" cy="100" rx="72" ry="92" />

      <!-- Equator Line -->
      <line x1="8" y1="100" x2="192" y2="100" stroke-width="4.5" />

      <!-- Northern Parallels (Latitudes) -->
      <path d="M 22 58 Q 100 82 178 58" />
      <path d="M 46 32 Q 100 50 154 32" />

      <!-- Southern Parallels (Latitudes) -->
      <path d="M 22 142 Q 100 118 178 142" />
      <path d="M 46 168 Q 100 150 154 168" />
    </g>

    <!-- Outer Circle Rim -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="#0852A5" stroke-width="8" />
  </g>

  <!-- Diagonal Banner with "BAS" -->
  <g transform="rotate(-18 100 100)">
    <!-- White Box Banner with Blue Outline -->
    <rect x="-4" y="68" width="208" height="64" fill="#FFFFFF" stroke="#0852A5" stroke-width="6" rx="6" />

    <!-- Bold Red BAS Letters -->
    <text x="100" y="117" text-anchor="middle" font-family="'Arial Black', 'Georgia', 'Trebuchet MS', sans-serif" font-weight="900" font-size="46" fill="#E0141D" letter-spacing="6">BAS</text>
  </g>
</svg>
