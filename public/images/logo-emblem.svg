<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="embGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="30%" stop-color="#E5B23B"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8F6306"/>
    </linearGradient>
    <linearGradient id="embRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="embNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <filter id="embGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Gold Ring with Navy Center -->
  <circle cx="50" cy="50" r="46" stroke="url(#embGoldGrad)" stroke-width="3.5" fill="url(#embNavyGrad)"/>
  <circle cx="50" cy="50" r="40" stroke="url(#embGoldGrad)" stroke-width="1.2" stroke-dasharray="3 2" fill="none" opacity="0.8"/>
  
  <!-- Ship Wheel / Compass Spikes -->
  <g stroke="url(#embGoldGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="6" x2="50" y2="16"/>
    <line x1="50" y1="84" x2="50" y2="94"/>
    <line x1="6" y1="50" x2="16" y2="50"/>
    <line x1="84" y1="50" x2="94" y2="50"/>
    <line x1="19" y1="19" x2="26" y2="26"/>
    <line x1="74" y1="74" x2="81" y2="81"/>
    <line x1="81" y1="19" x2="74" y2="26"/>
    <line x1="26" y1="74" x2="19" y2="81"/>
  </g>

  <!-- Golden Anchor -->
  <circle cx="50" cy="27" r="6" stroke="url(#embGoldGrad)" stroke-width="2.5" fill="none"/>
  <path d="M37 36 L63 36" stroke="url(#embGoldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 31 L50 72" stroke="url(#embGoldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 54 Q32 76 50 76 Q68 76 70 54" stroke="url(#embGoldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <polygon points="26,53 34,53 30,46" fill="url(#embGoldGrad)"/>
  <polygon points="66,53 74,53 70,46" fill="url(#embGoldGrad)"/>

  <!-- Red Center Star -->
  <polygon points="50,45 53,52 60,52 54,56 56,63 50,59 44,63 46,56 40,52 47,52" fill="url(#embRedGrad)" filter="url(#embGlow)"/>
</svg>
